name: Mac build and tests
on:
  push:
    paths: ['Mac/**', 'Windows/Windows/**', '.github/workflows/mac.yml']
  pull_request:
    paths: ['Mac/**', 'Windows/Windows/**', '.github/workflows/mac.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r Mac/requirements.txt
      - run: python -m unittest discover -s Windows/Windows/tests
      - run: python -m unittest discover -s Mac/tests -v
      - run: node Windows/Windows/tests/frontend-smoke.cjs
      - run: bash Mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WatchMouse-Mac
          path: Mac/dist/*.zip
