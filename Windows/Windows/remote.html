<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#101719">
  <meta name="color-scheme" content="dark">
  <title>WatchMouse</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/remote.css">
  <script src="/remote.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <main class="workspace">
      <section id="douyinPanel" class="douyin-panel" hidden aria-label="Video controls" data-i18n-aria="videoControls">
        <button type="button" data-key="up" class="douyin-previous" aria-label="Previous video" data-i18n-aria="previousVideo">↑</button>
        <button type="button" data-key="space" class="douyin-play" aria-label="Play or pause" data-i18n-aria="playPause">Ⅱ / ▶</button>
        <button type="button" data-key="down" class="douyin-next" aria-label="Next video" data-i18n-aria="nextVideo">↓</button>
      </section>
      <section id="mousePanel" class="mouse-controller" aria-label="Mouse controls" data-i18n-aria="mouseControls">
        <div id="touchpad" class="touchpad" aria-label="Touchpad: move with one finger, tap to click, scroll with two fingers" data-i18n-aria="touchpad">
          <span id="touchIndicator" class="touch-indicator" hidden aria-hidden="true"></span>
        </div>
        <div class="mouse-buttons"><button type="button" data-command="C" class="mouse-button" aria-label="Left click" data-i18n-aria="leftClick" data-i18n="left">Left</button><button id="dragButton" type="button" class="mouse-button" aria-label="Drag: hold the left mouse button" data-i18n-aria="dragOff" aria-pressed="false" data-i18n="drag">Drag</button><button type="button" data-command="RC" class="mouse-button" aria-label="Right click" data-i18n-aria="rightClick" data-i18n="right">Right</button></div>
        <div class="scroll-rail" aria-label="Scroll" data-i18n-aria="scroll"><button type="button" data-command="S 3" aria-label="Scroll up" data-i18n-aria="scrollUp">↑</button><div id="scrollSurface" class="scroll-surface" aria-label="Slide one finger up or down to scroll" data-i18n-aria="scrollSurface"></div><button type="button" data-command="S -3" aria-label="Scroll down" data-i18n-aria="scrollDown">↓</button></div>
      </section>
      <section id="keyboardPanel" class="keyboard-panel" hidden aria-label="Phone input" data-i18n-aria="phoneInput">
        <div class="draft-composer"><textarea id="textInput" rows="2" maxlength="4000" placeholder="Type…" data-i18n-placeholder="type" aria-label="Text draft" data-i18n-aria="draft" autocapitalize="off" spellcheck="false"></textarea><button id="speechButton" class="speech-button" type="button" hidden aria-label="Browser dictation" data-i18n-aria="speech">🎙</button><button id="sendTextButton" class="send-button" type="button" aria-label="Send draft to computer" data-i18n-aria="sendDraft">↗</button></div>
        <div id="textFeedback" class="visually-hidden" role="status" aria-live="polite"></div>
        <div class="draft-actions" aria-label="Common actions" data-i18n-aria="commonActions"><button id="deleteTextButton" type="button" aria-label="Computer backspace" data-i18n-aria="backspace">⌫</button><button type="button" data-key="space" aria-label="Computer space" data-i18n-aria="space">␣</button><button type="button" data-key="enter" aria-label="Computer Enter" data-i18n-aria="enter">↵</button><button id="openPhoneKeyboard" type="button" aria-label="Open phone keyboard" data-i18n-aria="phoneKeyboard">⌨</button></div>
      </section>
    </main>
    <footer class="bottom-bar">
      <section id="connectionPanel" class="connection-panel" hidden aria-label="Connection settings" data-i18n-aria="connectionSettings">
        <div class="connection-meta"><span id="serverAddress"></span><a id="watchLink" href="/watch" data-i18n="watch">Watch ↗</a></div>
        <div class="pairing-row"><input id="pairingCode" type="password" placeholder="Pairing code" data-i18n-placeholder="pairingCode" aria-label="Pairing code" data-i18n-aria="pairingCode" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="pairButton" class="accent-button" type="button" data-i18n="connect">Connect</button></div>
        <label class="speed-setting"><span data-i18n="speed">Speed</span><input id="sensitivity" type="range" min="0.5" max="3" step="0.1" value="1.4" aria-label="Mouse movement speed" data-i18n-aria="mouseSpeed"></label>
        <label class="language-setting"><span data-i18n="language">Language</span><select id="languageSelect" aria-label="Interface language" data-i18n-aria="interfaceLanguage"><option value="en">English</option><option value="zh">中文</option></select></label>
        <div id="connectionMessage" class="connection-message" role="status"></div>
      </section>
      <div id="actionFeedback" class="visually-hidden" role="status" aria-live="polite"></div>
      <div class="footer-controls"><nav class="mode-switcher" aria-label="Control mode" data-i18n-aria="controlMode"><button id="douyinModeButton" type="button" data-mode="douyin" aria-pressed="false" data-i18n="video">Video</button><button id="mouseModeButton" type="button" data-mode="mouse" aria-pressed="true" data-i18n="mouse">Mouse</button><button id="keyboardModeButton" type="button" data-mode="keyboard" aria-pressed="false" data-i18n="keyboard">Keyboard</button></nav><button id="connectionButton" class="status-button" type="button" aria-label="Connecting; open connection settings" data-i18n-aria="connectingSettings" aria-controls="connectionPanel" aria-expanded="false"><span id="statusDot" class="status-dot" aria-hidden="true"></span></button></div>
    </footer>
  </div>
</body>
</html>
